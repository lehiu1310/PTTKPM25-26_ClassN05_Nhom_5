  <text x="60" y="110" font-family="Segoe UI, Arial" font-size="18" fill="#475569">Wireframe mô tả các màn hình quan trọng của ứng dụng quản lý tài chính cá nhân.</text>

  <g transform="translate(70,150)">
    <rect x="0" y="0" width="240" height="520" rx="34" fill="#ffffff" stroke="#0f766e" stroke-width="4"/>
    <rect x="24" y="36" width="192" height="72" rx="16" fill="#0f766e"/>
    <text x="42" y="80" font-family="Segoe UI, Arial" font-size="18" font-weight="700" fill="#ffffff">Tổng quan</text>
    <rect x="24" y="132" width="192" height="80" rx="16" fill="#dff7ef"/>
    <text x="42" y="164" font-family="Segoe UI, Arial" font-size="15" fill="#134e4a">Số dư tháng này</text>
    <text x="42" y="192" font-family="Segoe UI, Arial" font-size="24" font-weight="700" fill="#0f172a">$11,325</text>
    <rect x="24" y="232" width="88" height="68" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="40" y="272" font-family="Segoe UI, Arial" font-size="14" fill="#0f172a">Thu</text>
