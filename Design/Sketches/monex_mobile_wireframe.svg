    <text x="42" y="362" font-family="Segoe UI, Arial" font-size="15" font-weight="700" fill="#9a3412">Trợ lý chi tiêu</text>
    <text x="42" y="390" font-family="Segoe UI, Arial" font-size="13" fill="#64748b">Cảnh báo theo dữ liệu thật</text>
    <rect x="24" y="454" width="192" height="38" rx="19" fill="#0f766e"/>
    <text x="84" y="479" font-family="Segoe UI, Arial" font-size="14" font-weight="700" fill="#ffffff">+ Thêm</text>
  </g>

  <g transform="translate(360,150)">
