  <g transform="translate(940,150)">
    <rect x="0" y="0" width="240" height="520" rx="34" fill="#ffffff" stroke="#dc2626" stroke-width="4"/>
    <text x="34" y="66" font-family="Segoe UI, Arial" font-size="22" font-weight="700" fill="#0f172a">Thông báo</text>
    <rect x="24" y="108" width="192" height="92" rx="16" fill="#fee2e2"/>
    <text x="42" y="140" font-family="Segoe UI, Arial" font-size="15" font-weight="700" fill="#991b1b">Hóa đơn quá hạn</text>
    <text x="42" y="168" font-family="Segoe UI, Arial" font-size="13" fill="#64748b">Bấm thanh toán để xử lý</text>
