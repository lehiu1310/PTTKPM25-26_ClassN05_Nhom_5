    <text x="42" y="256" font-family="Segoe UI, Arial" font-size="15" font-weight="700" fill="#155e75">Gợi ý ngân sách</text>
    <text x="42" y="284" font-family="Segoe UI, Arial" font-size="13" fill="#64748b">Dựa trên lịch sử thu chi</text>
