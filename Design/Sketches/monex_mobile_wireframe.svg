    <text x="34" y="66" font-family="Segoe UI, Arial" font-size="22" font-weight="700" fill="#0f172a">Thống kê</text>
    <rect x="24" y="102" width="192" height="126" rx="18" fill="#fef3c7" stroke="#f59e0b"/>
    <polyline points="42,194 80,156 118,174 156,132 198,150" fill="none" stroke="#b45309" stroke-width="5"/>
    <rect x="24" y="260" width="84" height="120" rx="10" fill="#fed7aa"/>
    <rect x="132" y="210" width="84" height="170" rx="10" fill="#fdba74"/>
